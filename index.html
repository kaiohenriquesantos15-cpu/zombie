<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZOMBIE RUSH</title>
</head>
<body style="background:#050505;color:#ccc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
<div id="st">Carregando Zombie Rush…</div>
<script>
(async()=>{
  const n=3;
  let b64='';
  for(let i=0;i<n;i++){
    document.getElementById('st').textContent='Carregando… '+(i+1)+'/'+n;
    b64+=await (await fetch('gz_'+i+'.txt')).text();
  }
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const stream=new Blob([bin]).stream().pipeThrough(ds);
  const html=await new Response(stream).text();
  document.open(); document.write(html); document.close();
})().catch(e=>{document.getElementById('st').textContent='Erro: '+e; console.error(e);});
</script>
</body>
</html>
